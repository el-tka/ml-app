[flake8]
exclude = 
    src/config/.env
    src/db/db.sqlite
    src/logs
    src/model/models
    src/jupyter_notebooks
per-file-ignores = 
    src/config/__init__.py: F401, WPS300
extend-ignore = W391, WPS111, W293, WPS404,
                W291, E501, WPS202, E124,
                WPS432, E127, E128, WPS201,
                E122, WPS237, WPS226 
max-arguments = 6
max-line-complexity = 18
max-local-variables = 13

